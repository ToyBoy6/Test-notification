<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #121212;
      border: 1px solid #262626;
      padding: 30px;
      border-radius: 12px;
      max-width: 350px;
      width: 100%;
      text-align: center;
    }
    h2 { font-size: 1.8rem; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-perm { background-color: #262626; color: white; border: 1px solid #363636; }
    .btn-show { background-color: #0095f6; color: white; }
    .status { font-size: 13px; color: #a8a8a8; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Instagram</h2>
    <button id="btn-perm" class="btn-perm">1. Activer les notifications</button>
    <button id="btn-show" class="btn-show">2. Envoyer la notification</button>
    <div id="status" class="status">En attente...</div>
  </div>

  <script>
    const statusDiv = document.getElementById('status');

    document.getElementById('btn-perm').addEventListener('click', async () => {
      if (!('Notification' in window)) {
        statusDiv.innerText = "Non supporté";
        return;
      }
      const perm = await Notification.requestPermission();
      statusDiv.innerText = "Permission : " + perm;
    });

    document.getElementById('btn-show').addEventListener('click', () => {
      if (Notification.permission !== 'granted') {
        alert("Veuillez d'abord autoriser les notifications !");
        return;
      }

      // Déclenchement direct via l'API standard
      try {
        const notif = new Notification("Instagram", {
          body: "charlotte_g33k a aimé votre photo.",
          icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
          tag: "insta-direct"
        });
        
        notif.onclick = function() {
          window.focus();
          notif.close();
        };

        statusDiv.innerText = "Notification déclenchée !";
      } catch (err) {
        statusDiv.innerText = "Erreur : " + err.message;
      }
    });
  </script>
</body>
</html>
