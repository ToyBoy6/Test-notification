<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Task Manager & IA</title>
  <!-- Importation du SDK Google Gen AI -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #121212;
      border: 1px solid #262626;
      padding: 25px;
      border-radius: 12px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    h2 { font-size: 1.6rem; margin-bottom: 5px; color: #fff; }
    .subtitle { font-size: 12px; color: #a8a8a8; margin-bottom: 20px; }
    
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #262626;
      color: white;
      border: 1px solid #363636;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    
    .btn-notif { background-color: #262626; color: white; border: 1px solid #363636; }
    .btn-todo { background-color: #0095f6; color: white; }
    .btn-back { background-color: #363636; color: white; margin-top: 20px; }

    .section { display: none; }
    .section.active { display: block; }

    #file-input { display: none; }
    .upload-label {
      display: block;
      background-color: #262626;
      color: #0095f6;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      cursor: pointer;
      border: 1px dashed #0095f6;
      font-size: 14px;
      font-weight: 600;
    }

    .status { font-size: 13px; color: #a8a8a8; margin-top: 15px; line-height: 1.4; }
    #preview { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
    
    ul { list-style: none; padding: 0; margin: 15px 0; text-align: left; }
    li { background: #1a1a1a; padding: 10px; margin-bottom: 8px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #262626; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Instagram</h2>
    <div class="subtitle">Gestionnaire de Tâches & Alertes</div>

    <!-- Clé API Gemini globale -->
    <input type="password" id="api-key" placeholder="Entrée clé API Gemini (pour l'IA)">

    <!-- MENU PRINCIPAL -->
    <div id="menu-section" class="section active">
      <button id="goto-notif" class="btn-notif">🔔 Tester les notifications</button>
      <button id="goto-todo" class="btn-todo">📋 To Do List & Vérif IA</button>
    </div>

    <!-- SECTION 1 : TEST NOTIFICATIONS -->
    <div id="notif-section" class="section">
      <button id="btn-perm" class="btn-notif">1. Activer les autorisations</button>
      <button id="btn-test-notif" class="btn-todo">2. Envoyer une alerte test</button>
      <button class="btn-back" onclick="switchSection('menu-section')">← Retour</button>
    </div>

    <!-- SECTION 2 : TO DO LIST & IA -->
    <div id="todo-section" class="section">
      <div style="font-size: 13px; color: #fff; margin-bottom: 8px; text-align: left;">Tâche active : <b>"Ranger son bureau"</b></div>
      
      <label for="file-input" class="upload-label">📸 Photo de preuve (IA)</label>
      <input type="file" id="file-input" accept="image/*" capture="environment">

      <img id="preview" alt="Aperçu de la photo">
      
      <button class="btn-back" onclick="switchSection('menu-section')">← Retour</button>
    </div>

    <div id="status" class="status">Prêt</div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "@google/genai";

    const statusDiv = document.getElementById('status');
    const apiKeyInput = document.getElementById('api-key');
    const fileInput = document.getElementById('file-input');
    const previewImg = document.getElementById('preview');

    // Navigation entre les écrans
    window.switchSection = function(sectionId) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      statusDiv.innerText = "Prêt";
    }

    document.getElementById('goto-notif').addEventListener('click', () => switchSection('notif-section'));
    document.getElementById('goto-todo').addEventListener('click', () => switchSection('todo-section'));

    // Enregistrement du Service Worker
    async function initSW() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
        } catch (err) {
          console.error("Erreur SW", err);
        }
      }
    }
    initSW();

    // Demande de permission notifications
    document.getElementById('btn-perm').addEventListener('click', async () => {
      const perm = await Notification.requestPermission();
      statusDiv.innerText = perm === 'granted' ? "Notifications autorisées !" : "Permission refusée.";
    });

    // Test notification manuelle
    document.getElementById('btn-test-notif').addEventListener('click', async () => {
      if (Notification.permission !== 'granted') {
        alert("Veuillez d'abord autoriser les notifications !");
        return;
      }
      try {
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification("Instagram", {
          body: "Ceci est un test d'alerte système !",
          icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
          vibrate: [200, 100, 200],
          tag: "insta-test"
        });
        statusDiv.innerText = "Notification envoyée !";
      } catch (err) {
        statusDiv.innerText = "Erreur : " + err.message;
      }
    });

    // Analyse de la photo par Gemini pour la To-Do List
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Veuillez renseigner votre clé API Gemini en haut de la page !");
        fileInput.value = "";
        return;
      }

      previewImg.src = URL.createObjectURL(file);
      previewImg.style.display = 'block';
      statusDiv.innerText = "Analyse de la photo par l'IA...";

      try {
        const ai = new GoogleGenAI({ apiKey: apiKey });
        
        // Conversion de l'image en base64
        const base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: [
            { inlineData: { data: base64Data, mimeType: file.type } },
            "Analyse cette photo par rapport à la tâche 'Ranger son bureau'. Réponds STRICTEMENT par 'OUI' si le bureau est rangé, ou par 'NON' si c'est en désordre."
          ],
        });

        const resultText = response.text.trim();

        if (resultText.toUpperCase().startsWith('OUI')) {
          statusDiv.innerText = "Tâche validée par l'IA ! 🎉";
          
          // Déclencher la notification de succès
          const reg = await navigator.serviceWorker.ready;
          if (reg) {
            reg.showNotification("Instagram - Tâche accomplie", {
              body: "Félicitations ! L'IA a validé votre tâche.",
              icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
              tag: "ai-success"
            });
          }
        } else {
          statusDiv.innerText = "Refusé par l'IA : La tâche n'a pas l'air complète.";
        }

      } catch (err) {
        statusDiv.innerText = "Erreur IA : " + err.message;
      }
    });
  </script>
</body>
</html>
