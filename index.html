  <script>
    // State management
    let selectedDelay = 0;
    const statusBadge = document.getElementById('status-badge');

    const btnTrigger = document.getElementById('btn-trigger');
    const presetSelect = document.getElementById('preset-select');
    const delayBtns = document.querySelectorAll('.delay-btn');

    // Instagram Notifications Config Map
    const presets = {
      like: {
        title: "Instagram",
        body: "charlotte_g33k a aimé votre photo.",
        icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
        tag: "insta-like"
      },
      comment: {
        title: "Instagram",
        body: "alex_dev vous a mentionné dans un commentaire : 'Super shot ! 🔥'",
        icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
        tag: "insta-comment"
      },
      message: {
        title: "Instagram",
        body: "sara_m vous a envoyé un message : 'On se voit ce soir ?'",
        icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
        tag: "insta-message"
      },
      follow: {
        title: "Instagram",
        body: "lucas_photo a commencé à vous suivre.",
        icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
        tag: "insta-follow"
      }
    };

    // Inline Service Worker Code Registration
    const swCode = `
      self.addEventListener('notificationclick', function(event) {
        event.notification.close();
        event.waitUntil(
          clients.matchAll({ type: 'window' }).then(function(clientList) {
            if (clientList.length > 0) return clientList[0].focus();
            return clients.openWindow('/');
          })
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);

    // Initialize Service Worker
    async function initSW() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register(swUrl);
          updatePermissionStatus();
        } catch (err) {
          statusBadge.innerText = "Erreur SW";
          statusBadge.className = "px-2.5 py-1 rounded-full font-semibold bg-red-500/10 text-red-400 border border-red-500/20";
        }
      } else {
        statusBadge.innerText = "SW Non Supporté";
        statusBadge.className = "px-2.5 py-1 rounded-full font-semibold bg-red-500/10 text-red-400 border border-red-500/20";
      }
    }

    // UI Status Update
    function updatePermissionStatus() {
      if (!('Notification' in window)) {
        statusBadge.innerText = "Incompatible";
        statusBadge.className = "px-2.5 py-1 rounded-full font-semibold bg-red-500/10 text-red-400 border border-red-500/20";
        return;
      }

      if (Notification.permission === 'granted') {
        statusBadge.innerText = "Autorisé";
        statusBadge.className = "px-2.5 py-1 rounded-full font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
      } else if (Notification.permission === 'denied') {
        statusBadge.innerText = "Bloqué";
        statusBadge.className = "px-2.5 py-1 rounded-full font-semibold bg-red-500/10 text-red-400 border border-red-500/20";
      } else {
        statusBadge.innerText = "Non configuré";
        statusBadge.className = "px-2.5 py-1 rounded-full font-semibold bg-yellow-500/10 text-yellow-400 border border-yellow-500/20";
      }
    }

    // Delay Selection UI Logic
    delayBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        delayBtns.forEach(b => {
          b.className = "delay-btn border border-instaBorder bg-black/40 text-gray-400 font-semibold py-2 rounded-xl text-xs hover:border-gray-500 transition";
        });
        btn.className = "delay-btn border border-instaPink bg-instaPink/10 text-instaPink font-semibold py-2 rounded-xl text-xs transition";
        selectedDelay = parseInt(btn.getAttribute('data-delay'), 10);
      });
    });

    // Request Permissions Button
    btnPerm.addEventListener('click', async () => {
      if (!('Notification' in window)) {
        alert("Ce navigateur ne prend pas en compte l'API Notification.");
        return;
      }
      const perm = await Notification.requestPermission();
      updatePermissionStatus();
    });

    // Trigger Notification Logic
    btnTrigger.addEventListener('click', async () => {
      if (Notification.permission !== 'granted') {
        alert("Veuillez autoriser les notifications d'abord (Bouton 1).");
        return;
      }

      const presetKey = presetSelect.value;
      const config = presets[presetKey];

      if (selectedDelay > 0) {
        btnTrigger.disabled = true;
        const originalText = btnTrigger.innerText;
        let count = selectedDelay;
        btnTrigger.innerText = `Déclenchement dans ${count}s...`;

        const interval = setInterval(() => {
          count--;
          if (count > 0) {
            btnTrigger.innerText = `Déclenchement dans ${count}s...`;
          } else {
            clearInterval(interval);
            btnTrigger.disabled = false;
            btnTrigger.innerText = originalText;
            dispatchNotification(config);
          }
        }, 1000);
      } else {
        dispatchNotification(config);
      }
    });

    // Dispatch System Notification via Service Worker
    async function dispatchNotification(config) {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.ready;
        if (reg) {
          reg.showNotification(config.title, {
            body: config.body,
            icon: config.icon,
            badge: config.icon,
            vibrate: [200, 100, 200],
            tag: config.tag,
            renotify: true
          });
        }
      }
    }

    // Initialize on load
    window.addEventListener('load', () => {
      initSW();
    });
  </script>
