<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Task Manager Pro & IA</title>
  <!-- SDK Google Gen AI -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background: #121212;
      border: 1px solid #262626;
      padding: 24px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.9);
    }
    h1 {
      font-size: 1.8rem;
      margin: 0 0 4px 0;
      text-align: center;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 12px;
      color: #8e8e8e;
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="password"], input[type="text"], select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      background: #262626;
      color: #ffffff;
      border: 1px solid #363636;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #0095f6;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-main { background-color: #0095f6; color: #fff; }
    .btn-secondary { background-color: #262626; color: #fff; border: 1px solid #363636; }
    .btn-danger { background-color: #ed4956; color: #fff; }
    .btn-back { background-color: #1a1a1a; color: #a8a8a8; margin-top: 15px; border: 1px solid #262626; }
    
    .section { display: none; }
    .section.active { display: block; }

    /* To-Do List Styles */
    .todo-form { display: flex; gap: 8px; margin-bottom: 15px; }
    .todo-form input { margin-bottom: 0; }
    .todo-form button { width: 80px; margin-top: 0; }
    ul { list-style: none; padding: 0; margin: 0 0 15px 0; max-height: 200px; overflow-y: auto; }
    li {
      background: #1a1a1a;
      border: 1px solid #262626;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    li.completed span { text-decoration: line-through; color: #737373; }
    .li-actions { display: flex; gap: 6px; }
    .btn-mini { padding: 4px 8px; font-size: 11px; margin: 0; width: auto; border-radius: 4px; }

    /* Form Notif */
    .form-group { text-align: left; margin-bottom: 10px; }
    .form-group label { font-size: 11px; color: #a8a8a8; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ccc; margin: 10px 0; }
    .checkbox-group input { width: auto; margin: 0; }

    #file-input { display: none; }
    .upload-label {
      display: block;
      background: #1a1a1a;
      color: #0095f6;
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed #0095f6;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }

    .status { font-size: 12px; color: #0095f6; margin-top: 15px; text-align: center; line-height: 1.4; word-break: break-word; }
    #preview { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Instagram</h1>
    <div class="subtitle">Task System & Notifications Studio</div>

    <!-- Clé API Gemini -->
    <input type="password" id="api-key" placeholder="🔑 Clé API Gemini (pour l'IA)">

    <!-- NAVIGATION PRINCIPALE -->
    <div id="menu-section" class="section active">
      <button id="goto-todo" class="btn-main">📋 To-Do List & Vérification IA</button>
      <button id="goto-notif" class="btn-secondary">⚙️ Studio de Notifications</button>
      <button id="btn-perm" class="btn-secondary" style="margin-top:20px;">🔔 Autoriser les Notifications</button>
    </div>

    <!-- SECTION 1 : TO-DO LIST & IA -->
    <div id="todo-section" class="section">
      <div class="todo-form">
        <input type="text" id="new-todo-input" placeholder="Nouvelle tâche...">
        <button id="add-todo-btn" class="btn-main">+</button>
      </div>

      <ul id="todo-list"></ul>

      <div id="ai-verify-box" style="display:none; border-top: 1px solid #262626; padding-top: 15px; margin-top: 15px;">
        <div style="font-size: 12px; color: #aaa; text-align: left; margin-bottom: 5px;">Vérification IA pour : <b id="current-task-name" style="color:#fff;">-</b></div>
        <label for="file-input" class="upload-label">📸 Prendre la preuve en photo</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">
        <img id="preview" alt="Aperçu">
      </div>

      <button class="btn-back" onclick="switchSection('menu-section')">← Retour au menu</button>
    </div>

    <!-- SECTION 2 : STUDIO DE NOTIFICATIONS -->
    <div id="notif-section" class="section">
      <div class="form-group">
        <label>Titre</label>
        <input type="text" id="notif-title" value="Instagram">
      </div>

      <div class="form-group">
        <label>Message (Body)</label>
        <input type="text" id="notif-body" value="charlotte_g33k a aimé votre publication.">
      </div>

      <div class="form-group">
        <label>URL Icône (Profil)</label>
        <input type="text" id="notif-icon" value="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png">
      </div>

      <div class="form-group">
        <label>URL Image de bannière (Optionnel)</label>
        <input type="text" id="notif-image" placeholder="https://exemple.com/image.jpg">
      </div>

      <div class="form-group">
        <label>Délai avant l'envoi</label>
        <select id="notif-delay">
          <option value="0">Immédiat</option>
          <option value="3">3 secondes</option>
          <option value="5">5 secondes</option>
          <option value="10">10 secondes</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="notif-vibrate" checked>
        <label for="notif-vibrate">Activer les vibrations</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="notif-actions">
        <label for="notif-actions">Ajouter des boutons d'action (Voir / Ignorer)</label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="notif-require-interaction">
        <label for="notif-require-interaction">Maintenir affiché jusqu'au clic</label>
      </div>

      <button id="btn-send-custom-notif" class="btn-main">🚀 Envoyer la notification</button>
      <button class="btn-back" onclick="switchSection('menu-section')">← Retour au menu</button>
    </div>

    <div id="status" class="status">Prêt</div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "@google/genai";

    const statusDiv = document.getElementById('status');
    const apiKeyInput = document.getElementById('api-key');
    const fileInput = document.getElementById('file-input');
    const previewImg = document.getElementById('preview');

    // --- NAVIGATION ---
    window.switchSection = function(sectionId) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      statusDiv.innerText = "Prêt";
    }

    document.getElementById('goto-notif').addEventListener('click', () => switchSection('notif-section'));
    document.getElementById('goto-todo').addEventListener('click', () => switchSection('todo-section'));

    // --- SERVICE WORKER ---
    async function initSW() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
          statusDiv.innerText = "Service Worker connecté";
        } catch (err) {
          statusDiv.innerText = "Erreur SW : " + err.message;
        }
      }
    }
    initSW();

    // Permissions
    document.getElementById('btn-perm').addEventListener('click', async () => {
      const perm = await Notification.requestPermission();
      statusDiv.innerText = perm === 'granted' ? "Notifications autorisées !" : "Permission refusée : " + perm;
    });

    // --- TO-DO LIST MANAGEMENT ---
    let todos = JSON.parse(localStorage.getItem('insta_todos') || '[]');
    let currentTaskToVerify = null;

    function renderTodos() {
      const ul = document.getElementById('todo-list');
      ul.innerHTML = '';
      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        if (todo.completed) li.classList.add('completed');
        
        li.innerHTML = `
          <span>${todo.text}</span>
          <div class="li-actions">
            ${!todo.completed ? `<button class="btn-mini btn-main" onclick="selectForAi(${index})">📸 IA</button>` : '✅'}
            <button class="btn-mini btn-danger" onclick="deleteTodo(${index})">✕</button>
          </div>
        `;
        ul.appendChild(li);
      });
      localStorage.setItem('insta_todos', JSON.stringify(todos));
    }

    document.getElementById('add-todo-btn').addEventListener('click', () => {
      const input = document.getElementById('new-todo-input');
      const text = input.value.trim();
      if (text) {
        todos.push({ text, completed: false });
        input.value = '';
        renderTodos();
      }
    });

    window.deleteTodo = function(index) {
      todos.splice(index, 1);
      document.getElementById('ai-verify-box').style.display = 'none';
      renderTodos();
    };

    window.selectForAi = function(index) {
      currentTaskToVerify = todos[index];
      document.getElementById('current-task-name').innerText = currentTaskToVerify.text;
      document.getElementById('ai-verify-box').style.display = 'block';
      statusDiv.innerText = "Prenez une photo pour valider : " + currentTaskToVerify.text;
    };

    renderTodos();

    // --- VERIFICATION IA (GEMINI) ---
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !currentTaskToVerify) return;

      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Veuillez d'abord saisir votre clé API Gemini !");
        fileInput.value = "";
        return;
      }

      previewImg.src = URL.createObjectURL(file);
      previewImg.style.display = 'block';
      statusDiv.innerText = "L'IA analyse la photo...";

      try {
        const ai = new GoogleGenAI({ apiKey });
        
        const base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: [
            { inlineData: { data: base64Data, mimeType: file.type } },
            `Analyse cette photo pour la tâche suivante : '${currentTaskToVerify.text}'. Réponds STRICTEMENT par 'OUI' si l'image prouve que la tâche est réalisée, ou 'NON' si ce n'est pas le cas.`
          ],
        });

        const resultText = response.text.trim();

        if (resultText.toUpperCase().startsWith('OUI')) {
          currentTaskToVerify.completed = true;
          renderTodos();
          document.getElementById('ai-verify-box').style.display = 'none';
          previewImg.style.display = 'none';
          statusDiv.innerText = "Succès ! Tâche validée par l'IA 🎉";

          // Déclencher la notification de validation
          const reg = await navigator.serviceWorker.ready;
          if (reg) {
            reg.showNotification("Instagram - Tâche accomplie", {
              body: `Félicitations ! L'IA a validé '${currentTaskToVerify.text}'.`,
              icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
              vibrate: [200, 100, 200],
              tag: "ai-task-done"
            });
          }
        } else {
          statusDiv.innerText = "Refusé par l'IA : La photo ne prouve pas que la tâche est faite.";
        }

      } catch (err) {
        statusDiv.innerText = "Erreur IA : " + err.message;
      }
    });

    // --- STUDIO DE NOTIFICATIONS CUSTOM ---
    document.getElementById('btn-send-custom-notif').addEventListener('click', async () => {
      if (Notification.permission !== 'granted') {
        alert("Veuillez d'abord autoriser les notifications !");
        return;
      }

      const title = document.getElementById('notif-title').value || 'Instagram';
      const body = document.getElementById('notif-body').value || '';
      const icon = document.getElementById('notif-icon').value;
      const image = document.getElementById('notif-image').value;
      const delay = parseInt(document.getElementById('notif-delay').value, 10);
      const vibrate = document.getElementById('notif-vibrate').checked;
      const actions = document.getElementById('notif-actions').checked;
      const requireInteraction = document.getElementById('notif-require-interaction').checked;

      const options = {
        body: body,
        icon: icon,
        badge: icon,
        tag: "custom-notif-" + Date.now(),
        requireInteraction: requireInteraction
      };

      if (image.trim() !== '') options.image = image;
      if (vibrate) options.vibrate = [200, 100, 200, 100, 200];
      if (actions) {
        options.actions = [
          { action: 'open', title: 'Voir' },
          { action: 'dismiss', title: 'Ignorer' }
        ];
      }

      if (delay > 0) {
        statusDiv.innerText = `Notification programmée dans ${delay} secondes...`;
        setTimeout(() => triggerNotification(title, options), delay * 1000);
      } else {
        triggerNotification(title, options);
      }
    });

    async function triggerNotification(title, options) {
      try {
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification(title, options);
        statusDiv.innerText = "Notification envoyée !";
      } catch (err) {
        statusDiv.innerText = "Erreur d'envoi : " + err.message;
      }
    }
  </script>
</body>
</html>
