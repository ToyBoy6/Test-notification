<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Notification Mobile</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      text-align: center;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      background-color: #0095f6;
      color: white;
      font-size: 15px;
    }
    button:active { background-color: #1877f2; }
    .status {
      font-size: 13px;
      color: #a8a8a8;
      margin-bottom: 15px;
      padding: 8px;
      background: #262626;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Notification Instagram</h2>
    <div id="status" class="status">Initialisation...</div>

    <button id="btn-perm">1. Autoriser les notifications</button>
    <button id="btn-show">2. Envoyer la vraie notification</button>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const btnPerm = document.getElementById('btn-perm');
    const btnShow = document.getElementById('btn-show');

    // 1. Enregistrement dynamique du Service Worker via un Blob
    const swCode = `
      self.addEventListener('notificationclick', function(event) {
        event.notification.close();
        event.waitUntil(
          clients.matchAll({ type: 'window' }).then(function(clientList) {
            if (clientList.length > 0) return clientList[0].focus();
            return clients.openWindow('/');
          })
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);

    async function registerSW() {
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.register(swUrl);
          statusDiv.innerText = "Prêt (Service Worker actif)";
          return reg;
        } catch (err) {
          statusDiv.innerText = "Erreur SW : " + err.message;
        }
      } else {
        statusDiv.innerText = "Service Worker non supporté.";
      }
    }

    // Demande de permission
    btnPerm.addEventListener('click', async () => {
      if ('Notification' in window) {
        const perm = await Notification.requestPermission();
        statusDiv.innerText = "Permission : " + perm;
        if (perm === 'granted') {
          alert("Permission accordée ! Vous pouvez cliquer sur le bouton 2.");
        } else {
          alert("La permission a été refusée dans le navigateur.");
        }
      } else {
        alert("Les notifications ne sont pas supportées.");
      }
    });

    // Envoi de la notification via le Service Worker
    btnShow.addEventListener('click', async () => {
      if (Notification.permission !== 'granted') {
        alert("Cliquez d'abord sur '1. Autoriser les notifications'");
        return;
      }

      const reg = await navigator.serviceWorker.ready;
      if (reg) {
        reg.showNotification("Instagram", {
          body: "charlotte_g33k a aimé votre photo.",
          icon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
          badge: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/132px-Instagram_logo_2016.svg.png",
          vibrate: [200, 100, 200],
          tag: "insta-test"
        });
      } else {
        alert("Le Service Worker n'est pas encore prêt.");
      }
    });

    // Initialisation au chargement
    registerSW();
  </script>
</body>
</html>
